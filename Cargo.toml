[package]
name = "mdbijou"
version = "0.0.4"
edition = "2021"
description = "Lightweight native Markdown and MDX reader + simple editor with syntax highlighting"
license = "MIT"
default-run = "mdbijou"

[[bin]]
name = "mdbijou"
path = "src/main.rs"

[[bin]]
name = "mdbijou-gpui"
path = "src/bin/mdbijou_gpui.rs"

[lib]
name = "mdbijou"
path = "src/lib.rs"

[features]
default = []

[dependencies]
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
directories = "6"
log = "0.4"
rfd = "0.15"
html5ever = "0.39.0"
markup5ever_rcdom = "0.39.0"
# Headless Mermaid.js-parity rendering (pinned to mermaid@11.12.3). 0.7+/0.8
# require rustc 1.95; 0.6.2 is the newest release compatible with our 1.92 toolchain.
merman = { version = "0.6.2", default-features = false, features = ["raster"] }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
# Keep the 0.5.1 API surface, with the upstream list-width correction from
# longbridge/gpui-component#2158 backported locally.  Current `main` requires
# a newer GPUI, so a full upstream checkout is intentionally not used here.
gpui-component = { path = "vendor/gpui-component/crates/ui" }
gpui_http_client = "=0.2.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
futures = "0.3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
